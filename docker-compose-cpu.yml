services:
  nb-whisper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nb-whisper
    ports:
      - "8000:8000"
    environment:
      # Model configuration
      # NbAiLabBeta/nb-whisper-large/medium/small/base/tiny
      - WHISPER_MODEL=NbAiLab/nb-whisper-large-distil-turbo-beta
      
      # Processing settings
      - CHUNK_LENGTH=28
      - NUM_BEAMS=5
      
      # File upload limits (1GB default)
      - MAX_FILE_SIZE=1073741824
    
    volumes:
      # Cache for HuggingFace models
      - ./model-cache:/root/.cache/huggingface
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/debug"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
