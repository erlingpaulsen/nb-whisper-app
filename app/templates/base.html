<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/png" href="/assets/cube_logo_96px.png" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <body>
    <header class="border-bottom py-4">

      <p class="mb-0">Powered by <a href="https://huggingface.co/NbAiLab/nb-whisper-large-distil-turbo-beta" class="text-decoration-none">nb-whisper-large-distil-turbo-beta</a> · erlingsp.no</p>
